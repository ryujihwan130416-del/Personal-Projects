    <h1>서울의 공원 산책</h1>
    <p>남산공원에서는 서울 도심과 한강을 한꺼번에 내려다볼 수 있습니다. 저녁 노을 때 방문하면 좋습니다.</p>
    <p>올림픽공원은 넓은 잔디와 조각 작품이 있어 자전거와 피크닉에 어울립니다.</p>
    <p>서울숲은 뚝섬 근처의 도시 숲으로, 사슴 방사장과 연못 산책로가 유명합니다.</p>
